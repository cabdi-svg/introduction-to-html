<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="verification-card">
            <div class="icon-wrapper">
                <svg class="lock-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C9.243 2 7 4.243 7 7V10H6C4.897 10 4 10.897 4 12V20C4 21.103 4.897 22 6 22H18C19.103 22 20 21.103 20 20V12C20 10.897 19.103 10 18 10H17V7C17 4.243 14.757 2 12 2ZM9 7C9 5.346 10.346 4 12 4C13.654 4 15 5.346 15 7V10H9V7ZM12 14C12.828 14 13.5 14.672 13.5 15.5C13.5 16.328 12.828 17 12 17C11.172 17 10.5 16.328 10.5 15.5C10.5 14.672 11.172 14 12 14Z" fill="currentColor"/>
                </svg>
            </div>
            
            <h1 class="title">Verify Your Account</h1>
            <p class="subtitle">We've sent a verification code to your email</p>
            <p class="email">example@email.com</p>
            
            <form class="otp-form">
                <div class="otp-input-group">
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" autocomplete="off">
                </div>
                
                <button type="submit" class="verify-btn">Verify Code</button>
            </form>
            
            <div class="resend-section">
                <p class="resend-text">Didn't receive the code?</p>
                <button class="resend-btn">Resend Code</button>
            </div>
            
            <div class="timer">
                <span class="timer-text">Code expires in: <span class="countdown">02:00</span></span>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
